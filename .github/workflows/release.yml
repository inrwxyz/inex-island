name: 'Release Inex Island'

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Check & Unit Tests
        run: |
          npm run typecheck
          npm test
          npm run build:frontend

      - name: Rust Clippy (-D warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust Unit Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Inex Island v__VERSION__'
          releaseBody: |
            ## Inex Island v__VERSION__

            ### ✨ What's New in v__VERSION__
            - 🧠 **Strict TypeScript & Vite 8 Architecture**: Migrated the entire Island & Settings frontend to strict TypeScript with modular `styles-parts/` and automated Vitest + Cargo + Clippy + Playwright Golden UI verification.
            - 📉 **Idle RAM & 5-Band Visualizer Optimization**: Enabled WebView2 `MEMORY_USAGE_TARGET_LEVEL_LOW` + working-set trim on idle/hide, and auto-paused Rust WASAPI loopback 512-point FFT capture when media stops or Smart Mode hides the island.
            - 🔒 **Quick Share / Inex Drop Engine Hardening**: Synced the hardened `wquickshare` engine (`UKEY2` SHA-512 verification, strict replay protection, 2 MB buffer caps, and path-traversal sanitization) plus parallel `4x4 MB` Speed Test upload calibration.
            - 🎨 **Settings & Screen Time Polish**: Added 5s cached Screen Time sync across `Apps | Screen Time` tabs and scrollable, high-contrast Settings dropdown menus.

            ### 📦 Installation
            Download `Inex Island___VERSION___x64-setup.exe` below and run the installer.
          releaseDraft: false
          prerelease: false
