<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Inex Drop</title>
<style>
:root { --bg: #0b0b0f; --card: #181820; --accent: #0a84ff; --fg: #f5f5f7; --dim: #8e8e93; --border: rgba(255,255,255,0.08); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; }
.card { width:100%; max-width:440px; background:var(--card); border:1px solid var(--border); border-radius:24px; padding:22px; box-shadow:0 12px 32px rgba(0,0,0,0.5); margin-bottom:16px; text-align:center; }
.header-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
.logo-title { display:flex; align-items:center; gap:8px; font-weight:700; font-size:18px; letter-spacing:-0.02em; }
.logo-ico { width:28px; height:28px; border-radius:50%; background:var(--accent); display:grid; place-items:center; }
.badge { font-size:11px; font-weight:600; padding:4px 10px; border-radius:12px; background:rgba(48,209,88,0.15); color:#30d158; border:1px solid rgba(48,209,88,0.3); }
.drop-zone { border:2px dashed rgba(255,255,255,0.15); border-radius:18px; padding:32px 16px; margin:16px 0; background:rgba(255,255,255,0.02); cursor:pointer; transition:all .18s; }
.drop-zone.hover { border-color:var(--accent); background:rgba(10,132,255,0.08); }
.drop-zone svg { width:44px; height:44px; stroke:var(--accent); stroke-width:2; fill:none; margin-bottom:8px; }
.drop-title { font-size:16px; font-weight:600; margin-bottom:4px; }
.drop-sub { font-size:12px; color:var(--dim); }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%; height:48px; border-radius:14px; border:none; font-size:15px; font-weight:600; cursor:pointer; background:var(--accent); color:#fff; transition:opacity .15s; }
.btn:active { opacity:0.8; }
.btn-outline { background:transparent; border:1px solid var(--border); color:var(--dim); margin-top:10px; height:42px; font-size:13px; }
.prog-box { display:none; margin:16px 0; text-align:left; }
.prog-bar-bg { width:100%; height:8px; border-radius:4px; background:rgba(255,255,255,0.1); overflow:hidden; margin-top:6px; }
.prog-fill { width:0%; height:100%; background:var(--accent); border-radius:4px; transition:width .1s linear; }
.prog-info { display:flex; justify-content:space-between; font-size:12px; color:var(--dim); }
.file-list { margin-top:16px; text-align:left; }
.file-list h4 { font-size:13px; color:var(--dim); margin:0 0 8px 4px; text-transform:uppercase; letter-spacing:0.04em; }
.file-item { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; background:rgba(255,255,255,0.04); border-radius:12px; margin-bottom:6px; font-size:13px; }
.file-item a { color:var(--accent); text-decoration:none; font-weight:600; }
.success-msg { display:none; padding:10px; border-radius:12px; background:rgba(48,209,88,0.12); color:#30d158; font-size:13px; font-weight:600; margin:12px 0; }
</style>
</head>
<body>
<div class="card">
  <div class="header-row">
    <div class="logo-title">
      <div class="logo-ico">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"><path d="M12 2v10M8 8l4-4 4 4M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
      </div>
      <span>Inex Drop</span>
    </div>
    <span class="badge" id="statusBadge">Connected</span>
  </div>

  <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    <div class="drop-title">Send to PC</div>
    <div class="drop-sub">Tap to select Photos, Videos, or Files</div>
  </div>
  <input type="file" id="fileInput" multiple style="display:none" onchange="handleFiles(this.files)">

  <div class="prog-box" id="progBox">
    <div class="prog-info">
      <span id="progFileName">Uploading...</span>
      <span id="progPct">0%</span>
    </div>
    <div class="prog-bar-bg"><div class="prog-fill" id="progFill"></div></div>
  </div>

  <div class="success-msg" id="successMsg">✓ File transferred to PC Downloads!</div>

  <div class="file-list" id="pcFilesBox" style="display:none;">
    <h4>Files from PC</h4>
    <div id="pcFilesList"></div>
  </div>

  <button class="btn btn-outline" onclick="disconnect()">Disconnect</button>
</div>

<script>
const pin = new URLSearchParams(window.location.search).get('pin') || '';

// Notify PC about device
function registerDevice() {
  const ua = navigator.userAgent;
  let dev = 'Mobile Device';
  if (/iPhone/i.test(ua)) dev = 'iPhone';
  else if (/iPad/i.test(ua)) dev = 'iPad';
  else if (/Android/i.test(ua)) {
    const match = ua.match(/;\s*([^;]+?)\s*Build/);
    dev = match ? match[1] : 'Android Phone';
  }
  fetch('/register?pin=' + encodeURIComponent(pin), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ device: dev })
  }).catch(()=>{});
}
registerDevice();

let consecutiveErrors = 0;
function pollFiles() {
  fetch('/files?pin=' + encodeURIComponent(pin))
    .then(r => {
      if (!r.ok) throw new Error('status ' + r.status);
      consecutiveErrors = 0;
      return r.json();
    })
    .then(data => {
      const list = document.getElementById('pcFilesList');
      const box = document.getElementById('pcFilesBox');
      if (data && data.length > 0) {
        box.style.display = 'block';
        list.innerHTML = data.map(f => `
          <div class="file-item">
            <span>${f.name} (${(f.size/1024/1024).toFixed(1)} MB)</span>
            <a href="/download/${encodeURIComponent(f.name)}?pin=${encodeURIComponent(pin)}" download>Download</a>
          </div>
        `).join('');
      } else {
        box.style.display = 'none';
      }
    }).catch(() => {
      consecutiveErrors++;
      if (consecutiveErrors >= 3) {
        document.body.innerHTML = '<div class="card" style="margin-top:60px;"><h2>Disconnected</h2><p style="color:var(--dim);">Inex Drop was turned off on PC.</p></div>';
      }
    });
}
setInterval(pollFiles, 3000);
pollFiles();

function handleFiles(files) {
  if (!files || files.length === 0) return;
  uploadQueue(Array.from(files));
}

async function uploadQueue(queue) {
  for (let i = 0; i < queue.length; i++) {
    await uploadSingle(queue[i]);
  }
}

function uploadSingle(file) {
  return new Promise((resolve) => {
    const progBox = document.getElementById('progBox');
    const progFill = document.getElementById('progFill');
    const progPct = document.getElementById('progPct');
    const progFileName = document.getElementById('progFileName');
    const successMsg = document.getElementById('successMsg');

    progBox.style.display = 'block';
    successMsg.style.display = 'none';
    progFileName.textContent = file.name;
    progFill.style.width = '0%';
    progPct.textContent = '0%';

    let lastTime = performance.now();
    let lastLoaded = 0;
    let speedText = '';

    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/upload?name=' + encodeURIComponent(file.name) + '&pin=' + encodeURIComponent(pin), true);

    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) {
        const pct = Math.round((e.loaded / e.total) * 100);
        const now = performance.now();
        const dt = (now - lastTime) / 1000;
        if (dt >= 0.25) {
          const bytesDiff = e.loaded - lastLoaded;
          const mbps = (bytesDiff / (1024 * 1024 * dt)).toFixed(1);
          speedText = `${mbps} MB/s`;
          lastTime = now;
          lastLoaded = e.loaded;
        }
        progFill.style.width = pct + '%';
        progPct.textContent = speedText ? `${speedText} • ${pct}%` : `${pct}%`;
      }
    };

    xhr.onload = () => {
      if (xhr.status === 200) {
        progFill.style.width = '100%';
        progPct.textContent = speedText ? `${speedText} • 100%` : '100%';
        successMsg.style.display = 'block';
        setTimeout(() => {
          progBox.style.display = 'none';
        }, 1800);
        resolve();
      } else {
        alert('Transfer disconnected: Inex Drop was turned off on PC.');
        document.body.innerHTML = '<div class="card" style="margin-top:60px;"><h2>Disconnected</h2><p style="color:var(--dim);">Inex Drop was turned off on PC.</p></div>';
        resolve();
      }
    };

    xhr.onerror = () => {
      alert('Upload failed: Inex Drop disconnected.');
      document.body.innerHTML = '<div class="card" style="margin-top:60px;"><h2>Disconnected</h2><p style="color:var(--dim);">Inex Drop was turned off on PC.</p></div>';
      resolve();
    };

    xhr.send(file);
  });
}

function disconnect() {
  fetch('/disconnect?pin=' + encodeURIComponent(pin), { method: 'POST' }).finally(() => {
    document.body.innerHTML = '<div class="card" style="margin-top:60px;"><h2>Disconnected</h2><p style="color:var(--dim);">Inex Drop was disconnected.</p></div>';
  });
}
</script>
</body>
</html>
