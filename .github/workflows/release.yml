name: 'Release Inex Island'

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Inex Island v__VERSION__'
          releaseBody: |
            ## Inex Island v__VERSION__

            ### ✨ What's New in v__VERSION__
            - 🎙️ **Aura Voice Assistant Bridge**: Native Named Pipe IPC (`\\.\pipe\InexIslandVoice`) integrating seamlessly with Aura voice assistant.
            - 🌈 **Ambient Rotating Border Glow**: Dynamic flowing multi-color border glow animation during active voice interactions.
            - ⚡ **Priority Wake & Fullscreen Awareness**: Smoothly unhides notch/island when speaking, even in fullscreen or auto-hide modes.
            - 🎨 **Settings & UI Optimizations**: Streamlined settings layout, quick action tiles, and enhanced system responsiveness.

            ### 📦 Installation
            Download `Inex Island___VERSION___x64-setup.exe` below and run the installer.
          releaseDraft: false
          prerelease: false
