<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#08080a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Inex Drop</title>
<style>
:root {
  --bg: #08080a;
  --card: #121216;
  --card-sub: rgba(255, 255, 255, 0.035);
  --accent-green: #30d158;
  --fg: #f5f5f7;
  --dim: #8e8e93;
  --border: rgba(255, 255, 255, 0.075);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; padding: 18px 14px;
  background: var(--bg); color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  min-height: 100vh; display: flex; flex-direction: column; align-items: center;
}
.card {
  width: 100%; max-width: 440px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 24px; padding: 22px;
  box-shadow: 0 16px 40px rgba(0,0,0,0.6);
  margin-bottom: 14px; text-align: center;
}
.header-row {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;
}
.logo-title {
  display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 17px; letter-spacing: -0.02em;
}
.logo-ico {
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(255, 255, 255, 0.1); border: 1px solid var(--border);
  display: grid; place-items: center;
}
.badge {
  font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 12px;
  background: rgba(48,209,88,0.14); color: var(--accent-green);
  border: 1px solid rgba(48,209,88,0.28);
}
.badge.offline {
  background: rgba(255,255,255,0.06); color: var(--dim);
  border: 1px solid var(--border);
}
.drop-zone {
  border: 2px dashed rgba(255,255,255,0.14); border-radius: 20px;
  padding: 38px 16px; margin: 14px 0; background: rgba(255,255,255,0.015);
  cursor: pointer; transition: all .18s;
}
.drop-zone.hover { border-color: rgba(255,255,255,0.4); background: rgba(255,255,255,0.05); }
.drop-zone svg { width: 44px; height: 44px; stroke: #fff; stroke-width: 1.8; fill: none; margin-bottom: 8px; opacity: 0.92; }
.drop-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
.drop-sub { font-size: 12px; color: var(--dim); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; height: 44px; border-radius: 13px; border: 1px solid var(--border);
  font-size: 14px; font-weight: 600; cursor: pointer;
  background: rgba(255,255,255,0.08); color: #fff; transition: opacity .15s, background .15s;
}
.btn:active { opacity: 0.82; }
.btn-primary {
  background: #fff !important; color: #000 !important; border: 0 !important; font-weight: 700;
}
.btn-green {
  background: var(--accent-green) !important; color: #fff !important; border: 0 !important;
  box-shadow: 0 2px 8px rgba(48, 209, 88, 0.32);
}
.btn-outline {
  background: transparent; border: 1px solid var(--border);
  color: var(--dim); margin-top: 10px; height: 38px; font-size: 12px;
}
.prog-box { display: none; margin: 14px 0; text-align: left; }
.prog-bar-bg {
  width: 100%; height: 6px; border-radius: 3px;
  background: rgba(255,255,255,0.08); overflow: hidden; margin-top: 6px;
}
.prog-fill {
  width: 0%; height: 100%; background: #fff; border-radius: 3px; transition: width .1s linear;
}
.prog-info {
  display: flex; justify-content: space-between; font-size: 11.5px; color: var(--dim);
}
.file-list { margin-top: 14px; text-align: left; }
.file-list-header {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
}
.file-list h4 {
  font-size: 11.5px; color: var(--dim); margin: 0;
  text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700;
}
.file-expire-pill {
  font-size: 10px; color: #ff9f0a; font-weight: 600; background: rgba(255,159,10,0.12);
  padding: 2px 7px; border-radius: 8px;
}
.file-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px; background: var(--card-sub); border: 1px solid var(--border);
  border-radius: 14px; margin-bottom: 8px; font-size: 13px; gap: 8px;
}
.success-msg {
  display: none; padding: 10px; border-radius: 12px;
  background: rgba(48,209,88,0.12); color: var(--accent-green);
  font-size: 12.5px; font-weight: 600; margin: 12px 0;
}
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: rgba(20,20,25,0.95); border: 1px solid rgba(255,255,255,0.14);
  color: #fff; padding: 9px 16px; border-radius: 20px; font-size: 12px; font-weight: 600;
  display: none; z-index: 999; box-shadow: 0 8px 24px rgba(0,0,0,0.6);
}
#scannerCard { display: none; }
</style>
</head>
<body>

<!-- 1. Offline / Standalone Home Screen PWA View -->
<div class="card" id="scannerCard">
  <div class="header-row">
    <div class="logo-title">
      <div class="logo-ico">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"><path d="M12 2v10M8 8l4-4 4 4M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
      </div>
      <span>Inex Drop</span>
    </div>
    <span class="badge offline">Standby</span>
  </div>
  <div style="padding:28px 12px 20px;text-align:center;">
    <svg viewBox="0 0 24 24" width="48" height="48" stroke="#fff" stroke-width="1.6" fill="none" style="opacity:0.8;margin-bottom:12px;"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="3"/></svg>
    <div style="font-size:16px;font-weight:600;margin-bottom:6px;">Connect to Inex Island</div>
    <div style="font-size:12px;color:var(--dim);margin-bottom:20px;">Scan the QR code on your PC screen to connect</div>
    <label class="btn btn-primary" style="display:flex;cursor:pointer;">
      <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.2" fill="none"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      <span>Scan PC QR Code</span>
      <input type="file" id="qrCameraInput" accept="image/*" capture="environment" style="display:none;" onchange="handleQrCamera(this)">
    </label>
  </div>
</div>

<!-- 2. Main Connected Inex Drop View -->
<div class="card" id="mainDropCard">
  <div class="header-row">
    <div class="logo-title">
      <div class="logo-ico">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"><path d="M12 2v10M8 8l4-4 4 4M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
      </div>
      <span>Inex Drop</span>
    </div>
    <span class="badge" id="statusBadge">Connected</span>
  </div>

  <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    <div class="drop-title">Send to PC</div>
    <div class="drop-sub">Tap to select Photos, Videos, or Files</div>
  </div>
  <input type="file" id="fileInput" multiple style="display:none" onchange="handleFiles(this.files)">

  <div class="prog-box" id="progBox">
    <div class="prog-info">
      <span id="progFileName">Uploading...</span>
      <span id="progPct">0%</span>
    </div>
    <div class="prog-bar-bg"><div class="prog-fill" id="progFill"></div></div>
  </div>

  <div class="success-msg" id="successMsg">✓ File transferred to PC Downloads!</div>

  <!-- Incoming Files from PC (Tray Push with 60s Expiration) -->
  <div class="file-list" id="pcFilesBox" style="display:none;">
    <div class="file-list-header">
      <h4>📥 Incoming from PC</h4>
      <span class="file-expire-pill" id="fileExpirePill">Expires in 60s</span>
    </div>
    <div id="pcFilesList"></div>
  </div>

  <button class="btn btn-outline" onclick="disconnect()">Disconnect</button>
</div>

<div class="toast" id="toastBox"></div>

<script>
let pin = new URLSearchParams(window.location.search).get('pin') || '';
const downloadedSet = new Set();
let expireSeconds = 60;
let expireInterval = null;

// Check standalone mode without PIN
if (!pin) {
  document.getElementById('scannerCard').style.display = 'block';
  document.getElementById('mainDropCard').style.display = 'none';
} else {
  document.getElementById('scannerCard').style.display = 'none';
  document.getElementById('mainDropCard').style.display = 'block';
}

function showMobileToast(msg) {
  const t = document.getElementById('toastBox');
  if (!t) return;
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 2200);
}

// 1. Device Registration
function registerDevice() {
  if (!pin) return;
  const ua = navigator.userAgent;
  let dev = 'Mobile Device';
  if (/iPhone/i.test(ua)) dev = 'iPhone';
  else if (/iPad/i.test(ua)) dev = 'iPad';
  else if (/Android/i.test(ua)) {
    const match = ua.match(/;\s*([^;]+?)\s*Build/);
    dev = match ? match[1] : 'Android Phone';
  }
  fetch('/register?pin=' + encodeURIComponent(pin), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ device: dev })
  }).catch(()=>{});
}
registerDevice();

// 2. Poll incoming files staged from PC Tray with 60s Expiration
let consecutiveErrors = 0;
let lastFileCount = 0;

function pollFiles() {
  if (!pin) return;
  fetch('/files?pin=' + encodeURIComponent(pin))
    .then(r => {
      if (!r.ok) throw new Error('status ' + r.status);
      consecutiveErrors = 0;
      return r.json();
    })
    .then(data => {
      const list = document.getElementById('pcFilesList');
      const box = document.getElementById('pcFilesBox');
      const pill = document.getElementById('fileExpirePill');

      // Filter out files already downloaded in this session
      const pendingFiles = (data || []).filter(f => !downloadedSet.has(f.name));

      if (pendingFiles.length > 0) {
        if (lastFileCount === 0) {
          expireSeconds = 60;
          clearInterval(expireInterval);
          expireInterval = setInterval(() => {
            expireSeconds--;
            if (pill) pill.textContent = `Expires in ${expireSeconds}s`;
            if (expireSeconds <= 0) {
              clearInterval(expireInterval);
              box.style.display = 'none';
            }
          }, 1000);
        }
        lastFileCount = pendingFiles.length;
        box.style.display = 'block';

        list.innerHTML = pendingFiles.map(f => {
          const safeName = f.name.replace(/"/g, '&quot;');
          const encodedName = encodeURIComponent(f.name);
          return `
            <div class="file-item">
              <div style="text-align:left;flex:1;overflow:hidden;padding-right:6px;">
                <strong style="display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${safeName}</strong>
                <small style="color:var(--dim);">${(f.size/1024/1024).toFixed(1)} MB</small>
              </div>
              <a href="/download/${encodedName}?pin=${encodeURIComponent(pin)}" download="${safeName}" onclick="onFileDownloadClick('${safeName}')" class="btn btn-green" style="height:32px;width:auto;padding:0 12px;font-size:11.5px;text-decoration:none;">Accept & Download</a>
            </div>
          `;
        }).join('');
      } else {
        lastFileCount = 0;
        clearInterval(expireInterval);
        box.style.display = 'none';
      }
    }).catch(() => {
      consecutiveErrors++;
      if (consecutiveErrors >= 3) {
        document.body.innerHTML = '<div class="card" style="margin-top:60px;"><h2>Disconnected</h2><p style="color:var(--dim);">Inex Drop was turned off on PC.</p></div>';
      }
    });
}
setInterval(pollFiles, 2500);
pollFiles();

// 3. Mark file as downloaded and expire immediately
function onFileDownloadClick(fileName) {
  downloadedSet.add(fileName);
  showMobileToast('Downloading ' + fileName + '...');
  setTimeout(() => {
    pollFiles();
  }, 1000);
}

// 4. File picker and upload flow
function handleFiles(files) {
  if (!files || files.length === 0) return;
  uploadQueue(Array.from(files));
}

async function uploadQueue(queue) {
  for (let i = 0; i < queue.length; i++) {
    await uploadSingle(queue[i]);
  }
}

async function uploadSingle(file) {
  const progBox = document.getElementById('progBox');
  const progFill = document.getElementById('progFill');
  const progPct = document.getElementById('progPct');
  const progFileName = document.getElementById('progFileName');
  const successMsg = document.getElementById('successMsg');

  progBox.style.display = 'block';
  successMsg.style.display = 'none';
  progFileName.textContent = 'Prompting PC to accept ' + file.name + '...';
  progFill.style.width = '20%';
  progPct.textContent = 'Waiting for PC...';

  // Step 1: Pre-flight transfer authorization check on PC
  let transferId = '';
  try {
    const reqRes = await fetch('/request_transfer?pin=' + encodeURIComponent(pin), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: file.name, size: file.size })
    }).then(r => r.json());
    if (reqRes && reqRes.id) {
      transferId = reqRes.id;
    }
  } catch (e) {
    alert('Could not contact PC');
    progBox.style.display = 'none';
    return;
  }

  // Step 2: Poll PC approval with 60-second timeout
  let approved = false;
  const startWait = Date.now();
  while (Date.now() - startWait < 60000) {
    await new Promise(r => setTimeout(r, 600));
    try {
      const check = await fetch(`/check_transfer?id=${transferId}&pin=${encodeURIComponent(pin)}`).then(r => r.json());
      if (check.status === 'accepted') {
        approved = true;
        break;
      } else if (check.status === 'declined') {
        progFileName.textContent = 'Transfer Declined on PC';
        progPct.textContent = 'Declined';
        progFill.style.background = '#ff453a';
        setTimeout(() => {
          progBox.style.display = 'none';
          progFill.style.background = '#fff';
        }, 2600);
        return;
      }
    } catch (_) {}
  }

  if (!approved) {
    progFileName.textContent = 'Transfer timed out (1 min)';
    setTimeout(() => { progBox.style.display = 'none'; }, 2000);
    return;
  }

  // Step 3: Stream high-speed upload to PC
  progFileName.textContent = 'Sending ' + file.name;
  progFill.style.width = '0%';
  progPct.textContent = '0%';

  return new Promise((resolve) => {
    let lastTime = performance.now();
    let lastLoaded = 0;
    let speedText = '';

    const xhr = new XMLHttpRequest();
    xhr.open('POST', `/upload?id=${transferId}&name=${encodeURIComponent(file.name)}&pin=${encodeURIComponent(pin)}`, true);

    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) {
        const pct = Math.round((e.loaded / e.total) * 100);
        const now = performance.now();
        const dt = (now - lastTime) / 1000;
        if (dt >= 0.2) {
          const bytesDiff = e.loaded - lastLoaded;
          const mbps = (bytesDiff / (1024 * 1024 * dt)).toFixed(1);
          speedText = `${mbps} MB/s`;
          lastTime = now;
          lastLoaded = e.loaded;
        }
        progFill.style.width = pct + '%';
        progPct.textContent = speedText ? `${speedText} • ${pct}%` : `${pct}%`;
      }
    };

    xhr.onload = () => {
      if (xhr.status === 200) {
        progFill.style.width = '100%';
        progPct.textContent = speedText ? `${speedText} • 100%` : '100%';
        successMsg.style.display = 'block';
        setTimeout(() => {
          progBox.style.display = 'none';
        }, 1800);
        resolve();
      } else {
        alert('Transfer failed or was declined on PC.');
        resolve();
      }
    };

    xhr.onerror = () => {
      alert('Upload failed: Inex Drop disconnected.');
      resolve();
    };

    xhr.send(file);
  });
}

// 5. In-browser Camera QR Scanner
function handleQrCamera(input) {
  if (input.files && input.files[0]) {
    // If the browser provides BarcodeDetector API (standard in modern Chrome on Android)
    if ('BarcodeDetector' in window) {
      const detector = new BarcodeDetector({ formats: ['qr_code'] });
      createImageBitmap(input.files[0]).then(bitmap => {
        return detector.detect(bitmap);
      }).then(barcodes => {
        if (barcodes.length > 0) {
          const urlStr = barcodes[0].rawValue;
          window.location.href = urlStr;
        } else {
          alert('No QR code detected. Try pointing camera directly at the PC QR code.');
        }
      }).catch(err => {
        alert('Scanning error: ' + err.message);
      });
    } else {
      alert('QR scanning ready. Open camera app or Google Lens to connect directly.');
    }
  }
}

function disconnect() {
  fetch('/disconnect?pin=' + encodeURIComponent(pin), { method: 'POST' }).finally(() => {
    document.body.innerHTML = '<div class="card" style="margin-top:60px;"><h2>Disconnected</h2><p style="color:var(--dim);">Inex Drop was disconnected.</p></div>';
  });
}
</script>
</body>
</html>
