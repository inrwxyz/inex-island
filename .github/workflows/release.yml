name: 'Release Inex Island'

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Check & Unit Tests
        run: |
          npm run typecheck
          npm test
          npm run build:frontend

      - name: Rust Clippy (-D warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust Unit Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Inex Island v__VERSION__'
          releaseBody: |
            ## Inex Island v__VERSION__

            ### ✨ What's New in v__VERSION__
            - 🎧 **Bluetooth Connect, Disconnect & Unpair Fix**: Fixed Tauri command bindings (`bt_set_connection`, `bt_unpair`), immediate `bluetooth-changed` UI sync, and multi-endpoint (A2DP + HFP) audio oneshot signaling.
            - 📶 **Wi-Fi Smooth Live Refresh & Connected SSID**: Fixed Control Deck subview live updates (`isWifiViewOpen()`), guarded concurrent scans, and synced `#deck-wifi-sub` (`mqFit`) and `Connected` labels immediately after connect/disconnect/join.
            - ⛈️ **Severe Thunderstorm Status Alert Style**: Matched the Island compact thunderstorm status alert (`#c-toast.t-storm`) to the Settings preview red danger triangle icon & badge while preserving compact pill dimensions.

            ### 📦 Installation
            Download `Inex Island___VERSION___x64-setup.exe` below and run the installer.
          releaseDraft: false
          prerelease: false
